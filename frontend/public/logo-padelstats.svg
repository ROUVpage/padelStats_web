<svg xmlns="http://www.w3.org/2000/svg" width="160" height="120" viewBox="0 0 160 120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="160" height="120" rx="24" ry="24" fill="url(#bg)" stroke="#4ade80" stroke-width="2" filter="url(#glow)"/>
  <text x="80" y="75" font-family="Arial Black, Arial, sans-serif" font-size="52" font-weight="900" fill="#4ade80" text-anchor="middle" letter-spacing="-2">PS</text>
  <text x="80" y="100" font-family="Arial, sans-serif" font-size="9" fill="#9ca3af" text-anchor="middle" letter-spacing="3" font-weight="normal">PADELSTATS</text>
</svg>
